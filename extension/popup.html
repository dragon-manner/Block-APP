<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  body { margin: 0; width: 280px; background: #0E0F0C; color: #F1F2EC; font: 14px/1.45 system-ui, sans-serif; }
  main { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
  .k { width: 28px; height: 28px; border-radius: 9px; background: #C6F432; color: #141A00; display: grid; place-items: center; font-weight: 800; }
  .card { background: #1A1C17; border: 1px solid #23261F; border-radius: 14px; padding: 12px; }
  .big { font-size: 28px; font-weight: 750; }
  .muted { color: #9A9D93; font-size: 12.5px; }
  .bad { color: #FF7A3D; }
  .good { color: #C6F432; }
</style>
</head>
<body>
<main>
  <header><span class="k">K</span> Keel</header>
  <div id="out" class="card muted">Checking…</div>
</main>
<script src="popup.js"></script>
</body>
</html>
