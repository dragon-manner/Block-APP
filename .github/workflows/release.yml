name: Build Keel

# Every push builds everything; a tag like v2.0.0 also publishes a GitHub release with the
# desktop installers (Linux + Windows), the Android APK, the server and the browser extension.
on:
  push:
    branches: [main, keel]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd ui && npm install --no-audit --no-fund && npm run build
      - uses: actions/upload-artifact@v4
        with: { name: ui-dist, path: ui/dist }

  server:
    needs: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: ui-dist, path: ui/dist }
      - uses: actions/setup-go@v5
        with: { go-version-file: server/go.mod }
      - name: Build static binaries
        run: |
          rm -rf server/embed/web && mkdir -p server/embed/web && cp -r ui/dist/. server/embed/web/
          cp shared/catalog.json server/embed/catalog.json
          cd server && go vet ./...
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags='-s -w' -o ../dist/keel-server-linux-$arch .
          done
      - uses: actions/upload-artifact@v4
        with: { name: server, path: dist/ }

  desktop:
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: ui-dist, path: desktop/dist }
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build
        shell: bash
        run: |
          cp shared/catalog.json desktop/src-tauri/catalog.json
          cd desktop && npm install --no-audit --no-fund && npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi

  android:
    needs: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: ui-dist, path: android/app/src/main/assets/ui }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # The runner image ships the Android SDK (ANDROID_HOME); setup-android's own sdkmanager
      # crashed on it, so it isn't used.
      - name: Build release APK
        run: |
          cp shared/catalog.json android/app/src/main/assets/catalog.json
          cd android && chmod +x gradlew && ./gradlew assembleRelease
          mkdir -p ../dist && cp app/build/outputs/apk/release/app-release.apk ../dist/keel-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/keel-android.apk }

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp shared/catalog.json extension/catalog.json
          mkdir -p dist && cd extension && zip -qr ../dist/keel-extension.zip .
      - uses: actions/upload-artifact@v4
        with: { name: extension, path: dist/keel-extension.zip }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, desktop, android, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/server/*
            artifacts/desktop-Linux/**/*
            artifacts/desktop-Windows/**/*
            artifacts/android/*
            artifacts/extension/*
